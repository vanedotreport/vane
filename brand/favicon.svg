    <path d="M13 11 L25 6.5"  stroke="#1E4E78" stroke-width="3"/>
    <path d="M6.5 24.5 L33 13.5" stroke="#B27B36" stroke-width="3.6"/>
    <path d="M13 31 L22 27"   stroke="#1E4E78" stroke-width="3"/>
  </g>
</svg>
