<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Vane — which way the flow is moving">
  <title>Vane</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131A21"/><stop offset="100%" stop-color="#0B1015"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- Barb field: the mark's own logic as a texture. Lengths vary; one is brass. -->
  <g stroke-linecap="round" opacity=".22">
    <path d="M1130 90  L1250 46"  stroke="#6BA3D6" stroke-width="5"/>
    <path d="M1130 150 L1310 84"  stroke="#6BA3D6" stroke-width="5"/>
    <path d="M1130 210 L1268 158" stroke="#6BA3D6" stroke-width="5"/>
    <path d="M1130 330 L1290 272" stroke="#6BA3D6" stroke-width="5"/>
    <path d="M1130 390 L1222 356" stroke="#6BA3D6" stroke-width="5"/>
    <path d="M1130 40  L1130 440" stroke="#6BA3D6" stroke-width="5"/>
  </g>
  <path d="M1060 282 L1360 158" stroke="#D9A45E" stroke-width="6.5" stroke-linecap="round" opacity=".85"/>

  <!-- Content kept clear of the bottom-left avatar cutout and the mobile side crop. -->
  <g transform="translate(150,178)">
    <g fill="none" stroke-linecap="round" transform="scale(2.05)">
      <path d="M13 5.5 L13 34.5"   stroke="#6BA3D6" stroke-width="2.1"/>
      <path d="M13 10.5 L23.5 6.2" stroke="#6BA3D6" stroke-width="2.1"/>
      <path d="M13 16 L29 9.5"     stroke="#6BA3D6" stroke-width="2.1"/>
      <path d="M6.5 24.5 L33 13.7" stroke="#D9A45E" stroke-width="2.6"/>
      <path d="M13 27 L25 22.1"    stroke="#6BA3D6" stroke-width="2.1"/>
      <path d="M13 32 L20.5 28.9"  stroke="#6BA3D6" stroke-width="2.1"/>
    </g>
    <text x="98" y="46" font-family="Avenir Next, Futura, system-ui, sans-serif" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#E6EAE7">Vane</text>
    <text x="101" y="80" font-family="Charter, Iowan Old Style, Georgia, serif" font-size="23" fill="#8C99A4">Which way the flow is moving</text>
  </g>
</svg>
