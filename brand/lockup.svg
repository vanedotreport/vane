    <path d="M13 10.5 L23.5 6.2" stroke="#1E4E78" stroke-width="2.1"/>
    <path d="M13 16 L29 9.5"     stroke="#1E4E78" stroke-width="2.1"/>
    <path d="M6.5 24.5 L33 13.7" stroke="#B27B36" stroke-width="2.6"/>
    <path d="M13 27 L25 22.1"    stroke="#1E4E78" stroke-width="2.1"/>
    <path d="M13 32 L20.5 28.9"  stroke="#1E4E78" stroke-width="2.1"/>
  </g>
  <text x="48" y="29" font-family="Avenir Next, Futura, Gill Sans, system-ui, sans-serif"
        font-size="27" font-weight="600" letter-spacing="-0.5" fill="#161C21">Vane</text>
</svg>
